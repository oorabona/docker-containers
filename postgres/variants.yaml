# PostgreSQL Container Variants
# Defines multiple image variants per PostgreSQL major version
#
# Each resolved version+variant produces a separate image tag and a major-line
# alias:
#   ghcr.io/oorabona/postgres:18.6-alpine         (v18 base)
#   ghcr.io/oorabona/postgres:18-alpine           (rolling v18 base alias)
#   etc.

# Build configuration
build:
  # Retain one current resolver result for every supported PostgreSQL major.
  # The resolver's -alpine suffix is part of the declared, published tag.
  retention_strategy: latest_per_major
  retained_majors: [18, 17, 16]
  # Dependencies: extension images must exist before building variants with extensions
  requires_extensions: true
  # Postgres builds all supported PG majors on every push (not just the latest line).
  # Rationale: each major is a long-lived supported release stream, not a rolling history.
  always_all_versions: true
  # Explicit bake opt-in for the FINAL image only. Extension compilation remains
  # owned by build-extensions; bake only consumes pre-built extension images.
  bake_final_build: true
# Versions to build (all maintained PostgreSQL releases)
versions:
  - tag: "18.6-alpine"
    # Numeric extension-build input for this retained major line.  It is
    # declared beside the resolved tag, rather than inferred from its shape.
    major: 18
    # The rolling major-line tag published beside this resolved tag.
    major_alias: "18-alpine"
    # PG18 - full extension support (Citus 14.0.0 adds PG 18 compatibility)
    variants:
      - name: base
        suffix: ""
        flavor: base
        description: "PostgreSQL with built-in extensions only"
        default: true
        when_to_use: Standard PostgreSQL with built-in extensions only — pick when you don't need vector search, analytics, or geospatial.
      - name: vector
        suffix: "-vector"
        flavor: vector
        description: "PostgreSQL + pgvector, pg_search, pg_cron, pg_ivm"
        when_to_use: PG with pgvector and paradedb — pick for AI/ML embeddings, similarity search, or full-text search.
      - name: analytics
        suffix: "-analytics"
        flavor: analytics
        description: "PostgreSQL + pg_partman, hypopg, pg_qualstats, postgis, pg_cron, pg_ivm"
        when_to_use: PG with paradedb, pg_ivm, pg_partman — pick for OLAP, materialized views, partitioning.
      - name: timeseries
        suffix: "-timeseries"
        flavor: timeseries
        description: "PostgreSQL + TimescaleDB, pg_partman, postgis, pg_cron, pg_ivm"
        when_to_use: PG with timescaledb — pick for IoT, metrics, time-series workloads.
      - name: spatial
        suffix: "-spatial"
        flavor: spatial
        description: "PostgreSQL + PostGIS for geospatial workloads"
        when_to_use: PG with postgis and pg_partman — pick for GIS, geospatial queries, partitioned spatial data.
      - name: distributed
        suffix: "-distributed"
        flavor: distributed
        description: "PostgreSQL + Citus, pg_cron, pg_ivm for horizontal scaling"
        when_to_use: PG with citus and pg_partman — pick for sharding, multi-tenant, horizontal scale.
      - name: full
        suffix: "-full"
        flavor: full
        description: "PostgreSQL with all compiled extensions"
        when_to_use: All extensions enabled — pick when prototyping or when scope is not yet defined.
  - tag: "17.11-alpine"
    # Numeric extension-build input for this retained major line.
    major: 17
    # The rolling major-line tag published beside this resolved tag.
    major_alias: "17-alpine"
    # PG17 - full extension support
    variants:
      - name: base
        suffix: ""
        flavor: base
        description: "PostgreSQL with built-in extensions only"
        default: true
        when_to_use: Standard PostgreSQL with built-in extensions only — pick when you don't need vector search, analytics, or geospatial.
      - name: vector
        suffix: "-vector"
        flavor: vector
        description: "PostgreSQL + pgvector, pg_search, pg_cron, pg_ivm"
        when_to_use: PG with pgvector and paradedb — pick for AI/ML embeddings, similarity search, or full-text search.
      - name: analytics
        suffix: "-analytics"
        flavor: analytics
        description: "PostgreSQL + pg_partman, hypopg, pg_qualstats, postgis, pg_cron, pg_ivm"
        when_to_use: PG with paradedb, pg_ivm, pg_partman — pick for OLAP, materialized views, partitioning.
      - name: timeseries
        suffix: "-timeseries"
        flavor: timeseries
        description: "PostgreSQL + TimescaleDB, pg_partman, postgis, pg_cron, pg_ivm"
        when_to_use: PG with timescaledb — pick for IoT, metrics, time-series workloads.
      - name: spatial
        suffix: "-spatial"
        flavor: spatial
        description: "PostgreSQL + PostGIS for geospatial workloads"
        when_to_use: PG with postgis and pg_partman — pick for GIS, geospatial queries, partitioned spatial data.
      - name: distributed
        suffix: "-distributed"
        flavor: distributed
        description: "PostgreSQL + Citus, pg_cron, pg_ivm for horizontal scaling"
        when_to_use: PG with citus and pg_partman — pick for sharding, multi-tenant, horizontal scale.
      - name: full
        suffix: "-full"
        flavor: full
        description: "PostgreSQL with all compiled extensions"
        when_to_use: All extensions enabled — pick when prototyping or when scope is not yet defined.
  - tag: "16.15-alpine"
    # Numeric extension-build input for this retained major line.
    major: 16
    # The rolling major-line tag published beside this resolved tag.
    major_alias: "16-alpine"
    # PG16 - full extension support
    variants:
      - name: base
        suffix: ""
        flavor: base
        description: "PostgreSQL with built-in extensions only"
        default: true
        when_to_use: Standard PostgreSQL with built-in extensions only — pick when you don't need vector search, analytics, or geospatial.
      - name: vector
        suffix: "-vector"
        flavor: vector
        description: "PostgreSQL + pgvector, pg_search, pg_cron, pg_ivm"
        when_to_use: PG with pgvector and paradedb — pick for AI/ML embeddings, similarity search, or full-text search.
      - name: analytics
        suffix: "-analytics"
        flavor: analytics
        description: "PostgreSQL + pg_partman, hypopg, pg_qualstats, postgis, pg_cron, pg_ivm"
        when_to_use: PG with paradedb, pg_ivm, pg_partman — pick for OLAP, materialized views, partitioning.
      - name: timeseries
        suffix: "-timeseries"
        flavor: timeseries
        description: "PostgreSQL + TimescaleDB, pg_partman, postgis, pg_cron, pg_ivm"
        when_to_use: PG with timescaledb — pick for IoT, metrics, time-series workloads.
      - name: spatial
        suffix: "-spatial"
        flavor: spatial
        description: "PostgreSQL + PostGIS for geospatial workloads"
        when_to_use: PG with postgis and pg_partman — pick for GIS, geospatial queries, partitioned spatial data.
      - name: distributed
        suffix: "-distributed"
        flavor: distributed
        description: "PostgreSQL + Citus, pg_cron, pg_ivm for horizontal scaling"
        when_to_use: PG with citus and pg_partman — pick for sharding, multi-tenant, horizontal scale.
      - name: full
        suffix: "-full"
        flavor: full
        description: "PostgreSQL with all compiled extensions"
        when_to_use: All extensions enabled — pick when prototyping or when scope is not yet defined.
tests:
  e2e:
    enabled: true
    # One cell. `full` assembles every compiled extension, so it exercises each
    # one's install and initialisation. What it does NOT exercise is the other
    # six `case` arms in the Dockerfile that assemble the narrower flavours:
    # dropping an `install_ext` from the `vector)` arm leaves `full)` intact and
    # this cell green. That gap wants the arms generated from the same filtered
    # list rather than six more e2e jobs — #1083.
    flavor: full
