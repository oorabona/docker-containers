# OpenTofu container configuration
# Tool versions are pinned here and updated by upstream-monitor, not at build time.
base_image: "${REMOTE_CR}/library/alpine:latest"
base_image_cache:
  - source: library/alpine
    tags: ["latest"]
  - source: library/python
    tags: ["3.12-alpine"]
# Upstream release artifact gate: `make check-updates` only proposes a new version once
# this URL answers 2xx (the git tag appears before the release assets). Probes the amd64
# tarball; the arm64 one and the SHA256SUMS ship in the same release. The Dockerfile
# derives its own URL from UPSTREAM_VERSION and declares ARTIFACT_URL only to accept
# the build-arg.
artifact_url: "https://github.com/opentofu/opentofu/releases/download/v${RELEASE_VERSION}/tofu_${RELEASE_VERSION}_linux_amd64.tar.gz"
build_args:
  TFLINT_VERSION: "0.66.0"
  TRIVY_VERSION: "0.76.2"
  TERRAGRUNT_VERSION: "1.2.1"
  TERRAFORM_DOCS_VERSION: "0.24.0"
  INFRACOST_VERSION: "0.10.49"
  GITHUB_CLI_VERSION: "2.103.3"
  AWS_CLI_VERSION: "1.46.3"
  AZURE_CLI_VERSION: "2.92.0"
  GCP_CLI_VERSION: "latest"
  JINJA2_CLI_VERSION: "1.0.1"
dependency_sources:
  TFLINT_VERSION:
    lifecycle: tracked
    type: github-release
    repo: terraform-linters/tflint
    strip_v: true
    artifact_urls:
      - "https://github.com/terraform-linters/tflint/releases/download/v${VERSION}/tflint_linux_amd64.zip"
      - "https://github.com/terraform-linters/tflint/releases/download/v${VERSION}/tflint_linux_arm64.zip"
  TRIVY_VERSION:
    lifecycle: tracked
    type: github-release
    repo: aquasecurity/trivy
    strip_v: true
    artifact_urls:
      - "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
      - "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-ARM64.tar.gz"
  TERRAGRUNT_VERSION:
    lifecycle: tracked
    type: github-release
    repo: gruntwork-io/terragrunt
    strip_v: true
    artifact_urls:
      - "https://github.com/gruntwork-io/terragrunt/releases/download/v${VERSION}/terragrunt_linux_amd64"
      - "https://github.com/gruntwork-io/terragrunt/releases/download/v${VERSION}/terragrunt_linux_arm64"
  TERRAFORM_DOCS_VERSION:
    lifecycle: tracked
    type: github-release
    repo: terraform-docs/terraform-docs
    strip_v: true
    artifact_urls:
      - "https://github.com/terraform-docs/terraform-docs/releases/download/v${VERSION}/terraform-docs-v${VERSION}-linux-amd64.tar.gz"
      - "https://github.com/terraform-docs/terraform-docs/releases/download/v${VERSION}/terraform-docs-v${VERSION}-linux-arm64.tar.gz"
  INFRACOST_VERSION:
    lifecycle: tracked
    type: github-release
    repo: infracost/infracost
    strip_v: true
    artifact_urls:
      - "https://github.com/infracost/infracost/releases/download/v${VERSION}/infracost-linux-amd64.tar.gz"
      - "https://github.com/infracost/infracost/releases/download/v${VERSION}/infracost-linux-arm64.tar.gz"
  GITHUB_CLI_VERSION:
    lifecycle: tracked
    type: github-release
    repo: cli/cli
    strip_v: true
    artifact_urls:
      - "https://github.com/cli/cli/releases/download/v${VERSION}/gh_${VERSION}_linux_amd64.tar.gz"
      - "https://github.com/cli/cli/releases/download/v${VERSION}/gh_${VERSION}_linux_arm64.tar.gz"
  AWS_CLI_VERSION:
    lifecycle: tracked
    type: pypi
    package: awscli
  AZURE_CLI_VERSION:
    lifecycle: tracked
    type: pypi
    package: azure-cli
  GCP_CLI_VERSION:
    monitor: false
    lifecycle: untracked
    reason: "Always latest — no version to track"
  JINJA2_CLI_VERSION:
    lifecycle: tracked
    type: pypi
    package: jinja2-cli
value_proposition: Multi-version retention (3 latest). OpenTofu with AWS, Azure and GCP CLI flavors and daily monitoring of tracked dependencies.
