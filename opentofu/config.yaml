# OpenTofu container configuration
# Tool versions are pinned here and updated by upstream-monitor, not at build time.
base_image: "${REMOTE_CR}/library/alpine:latest"
base_image_cache:
  - source: library/alpine
    tags: ["latest"]
  - source: library/python
    tags: ["3.12-alpine"]
build_args:
  TFLINT_VERSION: "0.64.0"
  TRIVY_VERSION: "0.74.0"
  TERRAGRUNT_VERSION: "1.1.6"
  TERRAFORM_DOCS_VERSION: "0.24.0"
  INFRACOST_VERSION: "0.10.46"
  GITHUB_CLI_VERSION: "2.101.0"
  AWS_CLI_VERSION: "1.46.1"
  AZURE_CLI_VERSION: "2.90.0"
  GCP_CLI_VERSION: "latest"
  JINJA2_CLI_VERSION: "1.0.1"
dependency_sources:
  TFLINT_VERSION:
    lifecycle: tracked
    type: github-release
    repo: terraform-linters/tflint
    strip_v: true
  TRIVY_VERSION:
    lifecycle: tracked
    type: github-release
    repo: aquasecurity/trivy
    strip_v: true
  TERRAGRUNT_VERSION:
    lifecycle: tracked
    type: github-release
    repo: gruntwork-io/terragrunt
    strip_v: true
  TERRAFORM_DOCS_VERSION:
    lifecycle: tracked
    type: github-release
    repo: terraform-docs/terraform-docs
    strip_v: true
  INFRACOST_VERSION:
    lifecycle: tracked
    type: github-release
    repo: infracost/infracost
    strip_v: true
  GITHUB_CLI_VERSION:
    lifecycle: tracked
    type: github-release
    repo: cli/cli
    strip_v: true
  AWS_CLI_VERSION:
    lifecycle: tracked
    type: pypi
    package: awscli
  AZURE_CLI_VERSION:
    lifecycle: tracked
    type: pypi
    package: azure-cli
  GCP_CLI_VERSION:
    monitor: false
    lifecycle: untracked
    reason: "Always latest — no version to track"
  JINJA2_CLI_VERSION:
    lifecycle: tracked
    type: pypi
    package: jinja2-cli
value_proposition: Multi-version retention (3 latest). OpenTofu with AWS, Azure and GCP CLI flavors and daily dependency monitoring.
