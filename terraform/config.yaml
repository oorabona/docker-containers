# Terraform container configuration
# Base image and third-party dependency versions
# NOTE: Tool versions are pinned here and updated by upstream-monitor, not at build time.

base_image: "${REMOTE_CR}/hashicorp/terraform:${UPSTREAM_VERSION}"
base_image_cache:
  # Cache must include ALL retained upstream versions, not just the latest:
  # each retained variant build does
  # `FROM ${REMOTE_CR}/hashicorp/terraform:<that-version>`, so a cache holding
  # only the latest tag would 404 retained builds on the GHCR path.
  # rotate-versions.sh keeps this array in sync with variants.yaml on each bump.
  - source: hashicorp/terraform
    tags: ["1.17.2", "1.17.1", "1.17.0"]
  - source: library/alpine
    tags: ["latest"]
  - source: library/python
    tags: ["3.12-alpine"]
build_args:
  TFLINT_VERSION: "0.66.0"
  TRIVY_VERSION: "0.76.2"
  TERRAGRUNT_VERSION: "1.2.2"
  TERRAFORM_DOCS_VERSION: "0.24.0"
  INFRACOST_VERSION: "0.10.49"
  GITHUB_CLI_VERSION: "2.103.3"
  AWS_CLI_VERSION: "1.46.3"
  AZURE_CLI_VERSION: "2.92.0"
  GCP_CLI_VERSION: "latest"
  JINJA2_CLI_VERSION: "1.0.1"
# Maps build_arg names to their upstream source for monitoring
# All build_args with pinned versions MUST have an entry here:
# - monitored deps: type + source info
# - frozen/excluded deps: monitor: false with reason
dependency_sources:
  TFLINT_VERSION:
    lifecycle: tracked
    type: github-release
    repo: terraform-linters/tflint
    strip_v: true
    artifact_urls:
      - "https://github.com/terraform-linters/tflint/releases/download/v${VERSION}/tflint_linux_amd64.zip"
      - "https://github.com/terraform-linters/tflint/releases/download/v${VERSION}/tflint_linux_arm64.zip"
  TRIVY_VERSION:
    lifecycle: tracked
    type: github-release
    repo: aquasecurity/trivy
    strip_v: true
    artifact_urls:
      - "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
      - "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-ARM64.tar.gz"
  TERRAGRUNT_VERSION:
    lifecycle: tracked
    type: github-release
    repo: gruntwork-io/terragrunt
    strip_v: true
    artifact_urls:
      - "https://github.com/gruntwork-io/terragrunt/releases/download/v${VERSION}/terragrunt_linux_amd64"
      - "https://github.com/gruntwork-io/terragrunt/releases/download/v${VERSION}/terragrunt_linux_arm64"
  TERRAFORM_DOCS_VERSION:
    lifecycle: tracked
    type: github-release
    repo: terraform-docs/terraform-docs
    strip_v: true
    artifact_urls:
      - "https://github.com/terraform-docs/terraform-docs/releases/download/v${VERSION}/terraform-docs-v${VERSION}-linux-amd64.tar.gz"
      - "https://github.com/terraform-docs/terraform-docs/releases/download/v${VERSION}/terraform-docs-v${VERSION}-linux-arm64.tar.gz"
  INFRACOST_VERSION:
    lifecycle: tracked
    type: github-release
    repo: infracost/infracost
    strip_v: true
    artifact_urls:
      - "https://github.com/infracost/infracost/releases/download/v${VERSION}/infracost-linux-amd64.tar.gz"
      - "https://github.com/infracost/infracost/releases/download/v${VERSION}/infracost-linux-arm64.tar.gz"
  GITHUB_CLI_VERSION:
    lifecycle: tracked
    type: github-release
    repo: cli/cli
    strip_v: true
    artifact_urls:
      - "https://github.com/cli/cli/releases/download/v${VERSION}/gh_${VERSION}_linux_amd64.tar.gz"
      - "https://github.com/cli/cli/releases/download/v${VERSION}/gh_${VERSION}_linux_arm64.tar.gz"
  AWS_CLI_VERSION:
    lifecycle: tracked
    type: pypi
    package: awscli
  AZURE_CLI_VERSION:
    lifecycle: tracked
    type: pypi
    package: azure-cli
  GCP_CLI_VERSION:
    monitor: false
    lifecycle: untracked
    reason: "Always latest — no version to track"
  JINJA2_CLI_VERSION:
    lifecycle: tracked
    type: pypi
    package: jinja2-cli
value_proposition: Multi-version retention (3 latest). AWS, Azure and GCP CLI flavors. Daily upstream monitoring of tracked dependencies.
