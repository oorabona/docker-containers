name: Cleanup Container Registry

on:
  schedule:
    # Run weekly every Monday at 3:17 AM UTC
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no deletions)'
        required: false
        type: boolean
        default: false
      purge_obsolete:
        description: 'Purge images with tags not matching current valid builds'
        required: false
        type: boolean
        default: false
      container_filter:
        description: 'Only process this container (optional, for targeted cleanup)'
        required: false
        type: string
        default: ''
      execute_ext_cleanup:
        description: 'Actually delete out-of-window extension tags (default: dry-run)'
        required: false
        type: boolean
        default: false

permissions:
  packages: write

env:
  KEEP_LATEST_COUNT: 10
  KEEP_MONTHS: 6

# Never cancel a started cleanup: a half-replayed deletion plan leaves no summary. The key is
# fixed rather than partitioned by container_filter, because cleanup-old-versions sweeps every
# discovered container and cleanup-ext-images is workflow-global.
# A newer dispatch supersedes a PENDING run, which shows up as cancelled. The obsolete-tag prune
# it carried is not recovered by the schedule, which runs that pruner with DRY_RUN=true.
concurrency:
  group: cleanup-registry
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cleanup old versions
        id: cleanup_old_versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          OWNER: ${{ github.repository_owner }}
        run: ./scripts/cleanup-old-versions.sh

      - name: Install yq
        if: ${{ always() && (github.event_name == 'schedule' || inputs.purge_obsolete == true) }}
        shell: bash
        run: yq --version

      - name: Purge obsolete images
        id: purge_obsolete_images
        continue-on-error: true
        if: ${{ always() && (github.event_name == 'schedule' || inputs.purge_obsolete == true) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run || 'false' }}
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CONTAINER_FILTER: ${{ inputs.container_filter }}
        run: |
          if [[ -n "$CONTAINER_FILTER" ]]; then
            ./scripts/cleanup-outdated-tags.sh "$CONTAINER_FILTER"
          else
            ./scripts/cleanup-outdated-tags.sh
          fi

      - name: Fail if registry cleanup failed
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.cleanup_old_versions.outcome }}" == "failure" || "${{ steps.purge_obsolete_images.outcome }}" == "failure" ]]; then
            exit 1
          fi

  cleanup-ext-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deletion is authorised by the most recent successful re-read of that exact
    # record. Nothing prevents a writer outside this workflow from changing it
    # between that re-read and DELETE.
    # Independent lifecycle job — not in any build/consume path.
    # Runs weekly on schedule and on every workflow_dispatch, including the automatic dispatch from upstream-monitor. Default: dry-run. Operator must set execute_ext_cleanup=true to delete.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yq
        shell: bash
        run: yq --version

      - name: Prune out-of-window extension image tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          # Boolean input moved to env to avoid expression injection in run:
          EXECUTE_EXT_CLEANUP: ${{ inputs.execute_ext_cleanup || 'false' }}
        run: |
          # Default: dry-run.  Operator must set execute_ext_cleanup=true to delete.
          if [[ "$EXECUTE_EXT_CLEANUP" == "true" ]]; then
            ./scripts/cleanup-ext-images.sh --execute
          else
            ./scripts/cleanup-ext-images.sh --dry-run
          fi
