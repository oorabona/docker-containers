name: Unit Tests

on:
  # Stats-only bot PRs still need a real unit-tests check because master
  # requires this status before auto-merge can complete.
  pull_request:
  push:
    # The stats PR already ran the required unit-tests check before merge.
    # Skip the redundant post-merge push run for stats-only squash commits.
    paths-ignore:
      - "stats/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install jq
        timeout-minutes: 5
        run: |
          command -v jq >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y jq
          }
          jq --version

      - name: Install yq
        timeout-minutes: 5
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.52.4/yq_linux_amd64
          echo "0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install busybox
        timeout-minutes: 5
        # postgres images are built FROM an Alpine base with no SHELL directive,
        # so their RUN steps execute under BusyBox ash with BusyBox applets.
        # tests/unit/postgres-extension-presence.bats runs the extracted
        # install_ext under this runner's BusyBox — the same shell and applet
        # family, not Alpine's own build of it — which is what lets the suite
        # see a GNU-only construct before the image build does. The test fails
        # rather than skips when /bin/busybox is absent.
        run: |
          command -v busybox >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y busybox-static
          }
          test -x /bin/busybox || sudo ln -s "$(command -v busybox)" /bin/busybox
          /bin/busybox sh -c 'echo busybox ok'

      - name: Install bats
        uses: ./.github/actions/setup-bats

      - name: Show bats version
        shell: bash
        run: bats --version

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          # Gate on the FULL unit suite: any unit test reaching a red state blocks
          # the merge (the #779 lesson — a drift in an ungated test file was invisible).
          # run-tests.sh runs all unit/*.bats in one `bats --jobs 4` pass (~9-12 min
          # on the 2-core runner; see timeout-minutes above).
          ./tests/run-tests.sh 2>&1 | tee /tmp/unit-tests.log
