name: Shellcheck

on:
  pull_request:
    paths:
      - '**/*.sh'
      - '**/config.yaml'
      - '**/variants.yaml'
      - '.yamllint.yml'
      - 'make'
      - '.github/workflows/shellcheck.yaml'
  push:
    branches: [master]
    paths:
      - '**/*.sh'
      - '**/config.yaml'
      - '**/variants.yaml'
      - '.yamllint.yml'
      - 'make'
      - '.github/workflows/shellcheck.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          set -euo pipefail
          shellcheck_status=0
          shellcheck --version || shellcheck_status=$?
          if [[ $shellcheck_status -ne 0 ]]; then
            echo "::error::shellcheck tooling availability check failed (exit $shellcheck_status)" >&2
            exit "$shellcheck_status"
          fi

      - name: Check duplicate YAML mapping keys
        run: |
          set -euo pipefail
          yamllint_dir="$RUNNER_TEMP/yamllint-1.37.1"
          yamllint_venv="$yamllint_dir/venv"
          mkdir -p "$yamllint_dir/requirements"

          cat > "$yamllint_dir/requirements/PyYAML.txt" <<'EOF'
          PyYAML==6.0.2 \
            --hash=sha256:9056c1ecd25795207ad294bcf39f2db3d845767be0ea6e6a34d856f006006083 \
            --hash=sha256:3b1fdb9dc17f5a7677423d508ab4f243a726dea51fa5e70992e59a7411c89d19 \
            --hash=sha256:ec031d5d2feb36d1d1a24380e4db6d43695f3748343d99434e6f5f9156aaa2ed \
            --hash=sha256:3ad2a3decf9aaba3d29c8f537ac4b243e36bef957511b4766cb0057d32b0be85 \
            --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 \
            --hash=sha256:70b189594dbe54f75ab3a1acec5f1e3faa7e8cf2f1e08d9b561cb41b845f69d5
          EOF
          cat > "$yamllint_dir/requirements/pathspec.txt" <<'EOF'
          pathspec==0.12.1 --hash=sha256:a0d503e138a4c123b27490a4f7beda6a01c6f288df0e4a8b79c7eb0dc7b4cc08
          EOF
          cat > "$yamllint_dir/requirements/yamllint.txt" <<'EOF'
          yamllint==1.37.1 --hash=sha256:364f0d79e81409f591e323725e6a9f4504c8699ddf2d7263d8d2b539cd66a583
          EOF

          if ! python3 -m venv "$yamllint_venv"; then
            echo "::error::yamllint installation failed: could not create isolated virtual environment at $yamllint_venv"
            exit 1
          fi

          install_package() {
            local package=$1 requirement_file=$2 status
            timeout --kill-after=5s 60s "$yamllint_venv/bin/python" -m pip install \
              --disable-pip-version-check --retries 2 --timeout 15 --no-deps --only-binary=:all: \
              --force-reinstall --require-hashes -r "$requirement_file" || status=$?
            if [[ -z ${status:-} ]]; then
              return 0
            fi
            if [[ $status -eq 124 || $status -eq 137 ]]; then
              echo "::error::yamllint installation timed out after 60 seconds while fetching or installing $package from PyPI"
            else
              echo "::error::yamllint installation could not fetch or install $package from PyPI (pip exited $status); see pip output above"
            fi
            return "$status"
          }

          install_package 'PyYAML==6.0.2' "$yamllint_dir/requirements/PyYAML.txt"
          install_package 'pathspec==0.12.1' "$yamllint_dir/requirements/pathspec.txt"
          install_package 'yamllint==1.37.1' "$yamllint_dir/requirements/yamllint.txt"

          "$yamllint_venv/bin/yamllint" --version

          # A linter can reproduce repository-controlled text verbatim. Disable
          # runner command parsing while it writes. Capture the child verdict
          # so the resume marker is written before the wrapper returns it.
          run_with_workflow_commands_stopped() (
            local stop_marker status
            if ! stop_marker=$(uuidgen) || [[ -z "$stop_marker" ]]; then
              echo "::error::could not mint a workflow command stop marker" >&2
              return 1
            fi
            if ! printf '::stop-commands::%s\n' "$stop_marker"; then
              echo "::error::could not write workflow command stop marker; refusing to run linter" >&2
              return 1
            fi
            if "$@" 2>&1; then
              status=0
            else
              status=$?
            fi
            if ! printf '\n::%s::\n' "$stop_marker"; then
              echo "::error::could not write workflow command resume marker; refusing to report lint success" >&2
              return 2
            fi
            return "$status"
          )

          # Run yamllint only after this search has collected and validated every YAML pathname.
          # The collector owns its annotation, so it must finish while runner
          # command parsing is live before the linter span opens.
          yaml_paths=$(mktemp)
          trap 'rm -f "$yaml_paths"' EXIT
          ./scripts/collect-safe-paths.sh . -type f \( -name config.yaml -o -name variants.yaml \) \
            -not -path './.git/*' > "$yaml_paths"
          run_with_workflow_commands_stopped xargs -r -0 "$yamllint_venv/bin/yamllint" -c .yamllint.yml < "$yaml_paths"

      - name: Run shellcheck on scripts
        run: |
          set -euo pipefail

          # Keep linter diagnostics inert: they can reproduce untrusted file
          # contents beginning with a GitHub Actions workflow command. Capture
          # the child verdict so the resume marker is printed before set -e can
          # leave the wrapper.
          workflow_command_stop_marker_failed=0
          run_with_workflow_commands_stopped() {
            local stop_marker status
            if ! stop_marker=$(uuidgen) || [[ -z "$stop_marker" ]]; then
              workflow_command_stop_marker_failed=1
              echo "::error::could not mint a workflow command stop marker" >&2
              return 1
            fi
            if ! printf '::stop-commands::%s\n' "$stop_marker"; then
              workflow_command_stop_marker_failed=1
              echo "::error::could not write workflow command stop marker; refusing to run linter" >&2
              return 1
            fi
            if "$@" 2>&1; then
              status=0
            else
              status=$?
            fi
            if ! printf '\n::%s::\n' "$stop_marker"; then
              echo "::error::could not write workflow command resume marker; refusing to report lint success" >&2
              return 2
            fi
            return "$status"
          }

          scripts=()

          # This collector covers pathnames produced by its searches; shellcheck -x sources and the project-root scripts appended below are outside this boundary.
          collect() {
            local collected f
            collected=$(mktemp)
            if ! ./scripts/collect-safe-paths.sh "$@" > "$collected"; then
              rm -f "$collected"
              return 1
            fi
            while IFS= read -r -d '' f; do
              scripts+=("$f")
            done < "$collected"
            rm -f "$collected"
          }

          # Collect build-system shell scripts only (not container runtime scripts)
          # Container entrypoints/install scripts have different constraints
          collect ./scripts ./helpers -name '*.sh' -type f

          # Add project-root scripts
          for f in ./make ./test-all-containers.sh ./validate-version-scripts.sh ./generate-dashboard.sh; do
            [[ -f "$f" ]] && scripts+=("$f")
          done

          # Add per-container test and version scripts (not runtime)
          collect . -maxdepth 2 \( -name 'test.sh' -o -name 'version.sh' \) -not -path './archive/*' -type f

          # Every shell script under a container's own tests/, at any depth, so a
          # helper the test sources is linted too. The pattern is anchored on the
          # first path component rather than written with -path, whose * crosses
          # slashes and so would also collect nested tests/ trees, the
          # repository-root one included; that tree has its own workflow. The two
          # trees the first collector already walks are left out so a script
          # under one of them is not linted, and counted, twice.
          collect . -mindepth 3 -regextype posix-extended \
            -regex '\./[^/]+/tests/.+\.sh' \
            -not -path './archive/*' -not -path './scripts/*' -not -path './helpers/*' -type f

          total=${#scripts[@]}
          passed=0
          failed=0
          failed_files=()

          for script in "${scripts[@]}"; do
            workflow_command_stop_marker_failed=0
            if run_with_workflow_commands_stopped shellcheck -x -S warning "$script"; then
              passed=$((passed + 1))
            else
              status=$?
              if [[ $workflow_command_stop_marker_failed -eq 1 ]]; then
                status=2
              fi
              if [[ $status -eq 1 ]]; then
                failed=$((failed + 1))
                failed_files+=("$script")
              else
                echo "::error::shellcheck tooling failed for $script (exit $status); expected 0 or finding status 1" >&2
                exit "$status"
              fi
            fi
          done

          {
            echo "## Shellcheck Results"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Total scripts | $total |"
            echo "| Passed | $passed |"
            echo "| Failed | $failed |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ $failed -gt 0 ]]; then
            {
              echo ""
              echo "### Failed scripts"
              for f in "${failed_files[@]}"; do
                echo "- \`$f\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"

            echo "❌ $failed/$total scripts have shellcheck warnings"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ All $total scripts passed shellcheck" | tee -a "$GITHUB_STEP_SUMMARY"
