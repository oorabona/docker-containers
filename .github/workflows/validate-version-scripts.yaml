name: Validate Version Scripts

on:
  pull_request:
    paths:
      - '**/version.sh'
      - '**/config.yaml'
      - 'validate-version-scripts.sh'
      - 'helpers/validate-base-cache-schema.sh'
      - 'helpers/base-cache-utils.sh'
      - '.github/workflows/validate-version-scripts.yaml'
      - '.github/workflows/upstream-monitor.yaml'
      - '.github/actions/check-upstream-versions/**'
  workflow_dispatch:
    inputs:
      container:
        description: 'Container to validate (optional, validates all if empty)'
        required: false
        type: string
      verbose:
        description: 'Enable verbose output'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Authenticate the GitHub API calls that version.sh makes (github-runner/vector/
# web-shell resolve versions from GitHub). This job tests EVERY version.sh with
# build_all_retained, so unauthenticated it exhausts the 60 req/hr limit and a
# GitHub-API version.sh comes back empty (rate-limit flake, #831).
#
# SECURITY: this job runs on `pull_request` and executes the PR's own version.sh
# code, so the token must NOT be exposed to untrusted fork PRs. Provide it only
# for non-PR events (workflow_dispatch) and SAME-REPO PRs (bot / write-access
# contributors — where the flake actually occurs); fork PRs get an empty string
# and stay unauthenticated. Same trust guard the repo uses for use_base_cache.
env:
  GITHUB_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.GITHUB_TOKEN || '' }}

jobs:
  validate-version-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install yq
        timeout-minutes: 5
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.52.4/yq_linux_amd64
          echo "0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq

      - name: Verify dependencies
        run: |
          # Verify that required dependencies are available
          # curl and git are pre-installed on ubuntu-latest runners, but let's confirm
          echo "✅ Verifying dependencies..."
          echo "- jq: $(jq --version)"
          echo "- curl: $(curl --version | head -1)"
          echo "- git: $(git --version)"
          echo "- yq: $(yq --version)"

          # Verify all dependencies are available
          command -v jq >/dev/null 2>&1 || { echo "❌ jq not found" && exit 1; }
          command -v curl >/dev/null 2>&1 || { echo "❌ curl not found" && exit 1; }
          command -v git >/dev/null 2>&1 || { echo "❌ git not found" && exit 1; }
          command -v yq >/dev/null 2>&1 || { echo "❌ yq not found" && exit 1; }
          echo "✅ All dependencies verified and ready"
      - name: Make scripts executable
        run: |
          chmod +x validate-version-scripts.sh
          chmod +x make
          find . -name "version.sh" -exec chmod +x {} \;

      - name: Validate version scripts
        env:
          REQUESTED_CONTAINER: ${{ github.event.inputs.container }}
          VERBOSE: ${{ github.event.inputs.verbose == 'true' && '1' || '0' }}
        run: |
          if [[ -n "$REQUESTED_CONTAINER" ]]; then
            echo "Validating specific container: $REQUESTED_CONTAINER"
            ./validate-version-scripts.sh "$REQUESTED_CONTAINER"
          else
            echo "Validating all version scripts"
            ./validate-version-scripts.sh
          fi

      - name: Detect containers for testing
        id: detect-containers
        uses: ./.github/actions/detect-containers
        with:
          force_rebuild: "true"  # Get all containers for comprehensive testing
          event_name: ${{ github.event_name }}
          # Comprehensive testing requires all retained versions, not just the latest line.
          build_all_retained: true

      - name: Test upstream monitoring action
        if: steps.detect-containers.outputs.count > 0
        id: test-upstream
        run: |
          containers_list="${{ steps.detect-containers.outputs.containers_list }}"
          first_container="${containers_list%%,*}"  # Get everything before first ,
          
          # Verify the selected container actually exists and has required files
          if [[ -d "$first_container" && -f "$first_container/Dockerfile" && -f "$first_container/version.sh" ]]; then
            echo "✅ Selected container for upstream test: $first_container"
            echo "first_container=$first_container" >> $GITHUB_OUTPUT
            echo "test_single=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  First container ($first_container) is not valid, skipping single container test"
            echo "test_single=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Run upstream monitoring test (single container)
        if: steps.detect-containers.outputs.count > 0 && steps.test-upstream.outputs.test_single == 'true'
        uses: ./.github/actions/check-upstream-versions
        with:
          container: ${{ steps.test-upstream.outputs.first_container }}
          # Inherits the fork-guarded value from the workflow-level env above
          # (empty on untrusted fork PRs).
          github_token: ${{ env.GITHUB_TOKEN }}

      - name: Test upstream monitoring action (all containers)
        if: github.event.inputs.container == '' && steps.detect-containers.outputs.count > 1
        uses: ./.github/actions/check-upstream-versions
        with:
          # Inherits the fork-guarded value from the workflow-level env above.
          github_token: ${{ env.GITHUB_TOKEN }}

      - name: Display test results
        env:
          REQUESTED_CONTAINER: ${{ github.event.inputs.container || '' }}
        run: |
          echo "## 🧪 Version Script Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ -n "$REQUESTED_CONTAINER" ]]; then
            echo "The \`$REQUESTED_CONTAINER/version.sh\` script passed its validation checks." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All version.sh scripts passed their validation checks." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          if [[ -n "$REQUESTED_CONTAINER" ]]; then
            echo "- **Validation completed:** ✅ \`$REQUESTED_CONTAINER/version.sh\` passed validation" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Validation completed:** ✅ All version.sh scripts passed validation" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Show which containers were used for upstream monitoring tests
          container_count="${{ steps.detect-containers.outputs.count }}"
          if [ "$container_count" -gt 0 ]; then
            if [[ "${{ steps.test-upstream.outputs.test_single }}" == "true" ]]; then
              first_container="${{ steps.test-upstream.outputs.first_container }}"
              # shellcheck disable=SC2129
              echo "- **Upstream monitoring test target:** \`$first_container\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Upstream monitoring action:** Selected-container check completed through make" >> $GITHUB_STEP_SUMMARY
              echo "- **Integration check:** Existing make script infrastructure exercised" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Upstream monitoring test:** Single container test skipped (no valid container found)" >> $GITHUB_STEP_SUMMARY
            fi
            if [[ -z "$REQUESTED_CONTAINER" && "$container_count" -gt 1 ]]; then
              echo "- **Additional tests:** All-container upstream check" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- **Upstream monitoring test:** Skipped (no containers detected)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### ✅ What was tested:" >> $GITHUB_STEP_SUMMARY
          if [[ -n "$REQUESTED_CONTAINER" ]]; then
            echo "- \`$REQUESTED_CONTAINER/version.sh\` was checked for shell syntax, dependencies, upstream version retrieval, and output format" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Each version.sh script was checked for shell syntax and dependencies" >> $GITHUB_STEP_SUMMARY
            echo "- Each version.sh script was checked for upstream version retrieval and output format" >> $GITHUB_STEP_SUMMARY
          fi
