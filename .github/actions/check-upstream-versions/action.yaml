name: 'Check Upstream Versions'
description: 'Checks if containers have newer upstream versions available and compares against published registry versions'

inputs:
  container:
    description: 'Container name to check (optional, checks all if empty)'
    required: false
    default: ''
  github_token:
    description: >
      Token for authenticated GitHub API calls made by version.sh scripts
      (github-runner/vector/web-shell resolve versions from GitHub — the shared
      helpers use this only when set). Passing it raises the API limit from
      60 to 1000+ req/hr and avoids rate-limit "empty version" flakes. Optional.
    required: false
    default: ''

outputs:
  containers_with_updates:
    description: 'JSON array of entries authorized to open a monitor PR'
    value: ${{ steps.check-versions.outputs.containers_with_updates }}
  update_count:
    description: 'Number of entries authorized to open a monitor PR'
    value: ${{ steps.check-versions.outputs.update_count }}
  version_info:
    description: 'JSON array of every version observation, including entries not authorized for monitor PRs'
    value: ${{ steps.check-versions.outputs.version_info }}

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        # Install jq if not available
        if ! command -v jq &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y jq
        fi

    - name: Check upstream versions
      id: check-versions
      shell: bash
      env:
        # Consumed by version.sh's GitHub helpers (latest-github-release/tag)
        # only when non-empty; empty = unauthenticated (previous behaviour).
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REQUESTED_CONTAINER: ${{ inputs.container }}
      run: |
        set -e
        
        # Make the main make script executable
        chmod +x make
        
        echo "🔍 Using make script to check for upstream updates..."
        
        # Use make script to get version information
        if [ -n "$REQUESTED_CONTAINER" ]; then
          echo "🎯 Checking specific container: $REQUESTED_CONTAINER"
          version_info=$(./make check-updates "$REQUESTED_CONTAINER")
        else
          echo "🔍 Checking all containers..."
          version_info=$(./make check-updates)
        fi
        
        # Extract entries authorized for monitor PRs (make script already handles all logic)
        containers_with_updates=()

        # A process substitution does not propagate jq's exit status to the
        # loop. Validate the complete producer payload first so malformed JSON
        # cannot be published as a successful zero-update observation.
        if ! jq -e '
          type == "array" and
          all(.[];
            type == "object" and
            (.container | type == "string" and length > 0) and
            (.update_available | type == "boolean") and
            (.actionable | type == "boolean") and
            (if .actionable then
              .update_available and
              (.registry_lookup | type == "string" and (. == "matched" or . == "no-match"))
            else
              true
            end)
          )
        ' <<< "$version_info" > /dev/null; then
          echo "::error::check-updates returned invalid or unauthorized version_info entry" >&2
          exit 1
        fi
        
        while IFS= read -r container_data; do
          container=$(echo "$container_data" | jq -r '.container')
          current_version=$(echo "$container_data" | jq -r '.current_version')
          latest_version=$(echo "$container_data" | jq -r '.latest_version')
          update_available=$(echo "$container_data" | jq -r '.update_available')
          actionable=$(echo "$container_data" | jq -r '.actionable == true')
          status=$(echo "$container_data" | jq -r '.status')
          
          echo "📋 $container: $current_version → $latest_version (update: $update_available)"
          
          # PR authorization is carried by make; absent fields fail closed.
          if [ "$actionable" = "true" ]; then
            if [ "$status" = "new-container" ]; then
              echo "   🆕 New container ready for initial release"
            else
              echo "   🚀 Update needed: $latest_version"
            fi
            containers_with_updates+=("$container")
          elif [ "$status" = "registry-lookup-failed" ]; then
            echo "   ⚠️ Registry lookup did not conclude — no PR from this entry"
          elif [ "$status" = "downgrade-guard-failed" ]; then
            echo "   ⚠️ Version comparison did not conclude — no PR from this entry"
          elif [ "$status" = "upstream-version-rejected" ]; then
            echo "   ⚠️ Upstream value does not match the declared version pattern — no PR from this entry"
          elif [ "$update_available" = "true" ]; then
            echo "   ⏸️ Update available but this container declines monitor PRs"
          else
            echo "   ✅ Up to date"
          fi
          
        done < <(echo "$version_info" | jq -c '.[]')
        
        # Create outputs
        if [ ${#containers_with_updates[@]} -eq 0 ]; then
          echo "containers_with_updates=[]" >> $GITHUB_OUTPUT
          echo "update_count=0" >> $GITHUB_OUTPUT
          echo "📋 No entries are authorized for monitor PRs"
        else
          container_json=$(printf '%s\n' "${containers_with_updates[@]}" | jq -R . | jq -s -c .)
          echo "containers_with_updates=$container_json" >> $GITHUB_OUTPUT
          echo "update_count=${#containers_with_updates[@]}" >> $GITHUB_OUTPUT
          echo "📋 Entries authorized for monitor PRs: ${containers_with_updates[*]}"
        fi
        
        # Output complete version info
        {
          echo "version_info<<EOF"
          echo "$version_info"
          echo "EOF"
        } >> $GITHUB_OUTPUT
